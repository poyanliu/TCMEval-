# ── TCM Literature Evaluation System ──────────────────────────────
# Domain: tcmeval.cn   Inference: ZhipuAI cloud API (no GPU needed)
#
#   API only:       docker-compose up -d
#   Streamlit only: docker-compose --profile streamlit up -d
#   Production:     docker-compose --profile production up -d
#
# First-run SSL:
#   docker-compose --profile production run --rm certbot \
#     certonly --webroot --webroot-path=/var/www/certbot \
#     -d tcmeval.cn -d www.tcmeval.cn --email your@email.com \
#     --agree-tos --no-eff-email

version: "3.8"

services:
  # ── Backend API ────────────────────────────────────────────────
  api:
    build: .
    image: tcm-evaluation:latest
    command: api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    environment:
      - TCM_HISTORY_FILE=/app/data/eval_history.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Streamlit Frontend ─────────────────────────────────────────
  streamlit:
    build: .
    image: tcm-evaluation:latest
    command: streamlit
    ports:
      - "${STREAMLIT_PORT:-6006}:6006"
    volumes:
      - ./data:/app/data
    environment:
      - STREAMLIT_PORT=6006
      - STREAMLIT_BASE_PATH=/literature
    restart: unless-stopped
    profiles:
      - streamlit

  # ── Nginx reverse proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - api
      - streamlit
    restart: unless-stopped
    profiles:
      - production

  # ── Certbot (SSL certificate auto-renewal) ─────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --quiet; done'"
    profiles:
      - production

volumes:
  certbot_www:
  certbot_certs:
