# ── Nginx config for TCM Evaluation System ─────────────────────────
# Reverse-proxies the API + Streamlit behind a single origin.
# Place at /etc/nginx/conf.d/default.conf or include from main config.
# Domain: tcmeval.cn

upstream api_backend {
    server api:8000;
    keepalive 16;
}

upstream streamlit_backend {
    server streamlit:6006;
    keepalive 16;
}

# ── Rate limiting ──────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=streamlit_limit:10m rate=30r/m;

# ── HTTP → HTTPS redirect ──────────────────────────────────────────
server {
    listen 80;
    server_name tcmeval.cn www.tcmeval.cn;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name tcmeval.cn www.tcmeval.cn;

    # SSL certificates (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/tcmeval.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tcmeval.cn/privkey.pem;

    # Modern SSL config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50m;

    # ── API ────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=2 nodelay;
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── API docs ───────────────────────────────────────────────────
    location /docs {
        proxy_pass http://api_backend/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://api_backend/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api_backend/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── Streamlit ──────────────────────────────────────────────────
    location /literature {
        limit_req zone=streamlit_limit burst=5 nodelay;
        proxy_pass http://streamlit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location /literature/_stcore/stream {
        proxy_pass http://streamlit_backend/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location /literature/_stcore/ {
        proxy_pass http://streamlit_backend/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # ── Streamlit static assets ────────────────────────────────────
    location ~ ^/literature/.*/(static/.*)$ {
        rewrite ^/literature/.*/(static/.*)$ /$1 break;
        proxy_pass http://streamlit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /literature/static/ {
        proxy_pass http://streamlit_backend/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
